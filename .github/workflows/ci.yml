# The gate for the public Games contract repository.
#
# This repository holds versioned contracts, JSON Schemas and test vectors for AgentNexus Games
# providers, and nothing else. A third party implements against it without access to anything
# private, so what it holds has to stay reviewable and free of anything operational.
#
# It runs on GitHub-hosted runners only: a public pull request can carry untrusted code, and it
# must never execute on an operator-maintained machine. It needs no secret, uses no token beyond
# `contents: read`, publishes nothing, tags nothing and signs nothing.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository contents and CI safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out this repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the pinned toolchain
        run: python -m pip install pytest==9.1.1 ruff==0.16.8 cryptography==50.0.1

      - name: Lint
        run: ruff check ci

      - name: Formatter
        run: ruff format --check ci

      - name: The check refuses what it must
        # Every rule is broken once in a copy of the repository, and the check has to name it.
        run: python -m pytest ci/test_repository.py -q

      - name: The grant ticket vector gets its published verdicts
        # The control ticket is accepted and the same ticket in another match is refused; the file
        # is reproducible from its published test seeds, and every rule of the format is broken
        # once and has to be refused for its own reason. Test keys only, valid nowhere.
        run: python -m pytest ci/test_grant_ticket.py -q

      - name: The Connect Four payloads and size limits get their published verdicts
        # The connect-four-1 move and observation schemas hold the values D-118 accepted, every
        # observation field carries a data class and a retained flag, every positive case passes
        # and every negative one fails, and every bound and limit is proven at its edge.
        run: python -m pytest ci/test_game_payloads.py -q

      - name: The Chess payloads and size limits get their published verdicts
        # The chess-1 and chess-1-solo schemas hold the values D-170 accepted: a UCI move whose
        # 1968-move vocabulary is derived independently, a typed draw claim inside the move, the
        # seat's own legal moves kept from viewers, and every bound and limit proven at its edge.
        run: python -m pytest ci/test_chess_payloads.py -q

      - name: The provider wire vector gets its published answers
        # The eight common schemas in protocol/v1 are D-114's with D-123's counter maximum; every
        # key, ticket and message signature is reproducible from its published test seed; every
        # step of every scenario gets its published answer; what stays open stays open. Test keys
        # only, valid nowhere.
        run: python -m pytest ci/test_provider_wire.py -q

      - name: The Chess wire vector gets its published answers
        # D-170: chess-1 and chess-1-solo over the same wire, with provider-wire-v1's test keys.
        # The same reference check answers every step; every observation and move passes its Chess
        # schema; the answers record the game played. Test keys only, valid nowhere.
        run: python -m pytest ci/test_chess_wire.py -q

      - name: An independent example client plays the wire
        # Written from the public files alone, it imports no reference check: its signed
        # messages are accepted step by step, and it discards an answer of an older seat
        # generation and rejects an invalid observation or refusal. No network, test keys only.
        run: python -m pytest ci/test_example_client.py -q

      - name: The provider manifest gets its published verdicts
        # The manifest's strict form; one accepted manifest and one refused for every rule of
        # its form and compatibility. Test keys only; the numbers are illustrative.
        run: python -m pytest ci/test_manifest.py -q

      - name: The signed outcome gets its published answers
        # The signed bytes, the test replay record and its digest, and the API's answer to
        # every step: four statuses and five refusals. Test keys only, valid nowhere.
        run: python -m pytest ci/test_outcome.py -q

      - name: The spectator contract gets its published answers
        # The capability, the snapshot and at most 16 events, a write refused read_only, every
        # capability failure unauthenticated, and views the browser must never render refused.
        run: python -m pytest ci/test_spectator.py -q

      - name: The spectator answer, version 2, gets its published answers
        # D-175: the version 1 answer and the provider's own clock facts, timing. The version 1
        # files are pinned as published; every answer and every refusal of the vector gets its
        # published verdict from the schema or the reference check; two streams start with the
        # snapshot and never go back in time; a provider that implements only version 1 may
        # ignore answer=2 or refuse it. Test capabilities only, valid nowhere.
        run: python -m pytest ci/test_spectator_v2.py -q

      - name: What this repository holds, and how its CI runs
        # Only declared files; no runtime code; the Apache-2.0 licence unchanged; valid JSON;
        # nothing shaped like a credential or a private host; workflows on GitHub-hosted runners,
        # read-only, without secrets, privileged triggers or third-party actions.
        run: python ci/check_repository.py
